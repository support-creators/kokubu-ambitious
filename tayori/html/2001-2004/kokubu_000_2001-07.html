  const scale=Math.min(1,viewport.clientWidth/width);
  paper.style.transform='scale('+scale+')';
  viewport.style.height=(height*scale)+'px';
 }
 updatePaperPreview();
 addEventListener('resize',updatePaperPreview);
 addEventListener('load',updatePaperPreview);
 addEventListener('afterprint',updatePaperPreview);
 if(document.fonts)document.fonts.ready.then(updatePaperPreview);
 if(window.ResizeObserver)new ResizeObserver(updatePaperPreview).observe(viewport);
})();
</script>
