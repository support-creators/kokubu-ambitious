<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>国分アンビシャス囲碁アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf6ea; --ink:#3b2f22; --sub:#7a6a55; --card:#fffdf7; --line:#e8dcc4;
  --accent:#2f8f5b; --accent-ink:#fff; --warn:#d9534f; --gold:#e0a526;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px 32px}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:40px;height:40px;flex:none}
h1{font-size:18px;line-height:1.25;margin:0;font-weight:800;flex:1;min-width:0;white-space:nowrap}
@media (max-width:420px){h1{font-size:15px}}
h1 small{display:block;font-size:12px;color:var(--sub);font-weight:500}
.who{border:0;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap}
.screen{display:none}.screen.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.label{font-size:12px;color:var(--sub);margin:0 0 6px}
.btn{border:0;border-radius:14px;padding:14px 8px;font-weight:800;font-size:15px;cursor:pointer;background:#efe4cc;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;font-size:18px;padding:18px}
.btn[hidden]{display:none}
ruby rt{font-size:.5em;font-weight:500}
/* 名前えらび */
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kid{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:16px 12px;text-align:center;cursor:pointer;position:relative}
.kid .nm{font-size:20px;font-weight:800;word-break:break-all}
.kid .lv{font-size:14px;color:var(--accent);font-weight:800;margin-top:4px}
.kid .del{position:absolute;top:6px;right:6px;border:0;background:#fde8e6;color:var(--warn);border-radius:10px;font-size:12px;padding:4px 8px;cursor:pointer}
.kid.add{border-style:dashed;white-space:nowrap;font-size:15px;color:var(--sub);display:flex;align-items:center;justify-content:center;font-weight:800;min-height:96px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:17px;background:#fff}
/* メニュー */
.level{text-align:center;padding:22px 14px}
.level .now{font-size:13px;color:var(--sub)}
.level .big{font-size:52px;font-weight:800;line-height:1.1;margin:4px 0}
.level .theme{display:inline-block;background:#e3f4ea;color:var(--accent);font-weight:800;border-radius:999px;padding:6px 14px;font-size:14px}
.ladder{display:flex;gap:3px;margin-top:14px}
.ladder i{flex:1;height:8px;border-radius:4px;background:#eadfc8}
.ladder i.done{background:var(--accent)}
.ladder i.cur{background:var(--gold)}
.menu{display:grid;gap:10px}
/* 盤と横パネル */
.play{display:flex;flex-direction:column;gap:12px}
@media (min-width:820px){.play{flex-direction:row;align-items:flex-start}.side{width:300px;flex:none}}
.boardbox{flex:1;min-width:0}
.boardcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px}
svg.board{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none}
.side{display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.dots{display:flex;gap:5px;margin-top:10px}
.dots i{flex:1;height:10px;border-radius:5px;background:#eadfc8}
.dots i.ok{background:var(--accent)}.dots i.ng{background:#e9a19d}.dots i.cur{outline:2px solid var(--gold)}
.qtitle{font-size:20px;font-weight:800;margin:10px 0 2px}
.qturn{font-size:13px;color:var(--sub)}
.msg{min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:14px;padding:8px 12px;font-weight:800;font-size:15px;background:var(--card);border:1px solid var(--line);color:var(--sub)}
.msg.warn{background:#fde8e6;border-color:#f6c9c5;color:var(--warn)}
.msg.good{background:#e3f4ea;border-color:#bfe3cd;color:var(--accent)}
.msg.hint{background:#fff6dc;border-color:#f1dfa6;color:#8a6500}
.btns{display:flex;gap:8px}.btns .btn{flex:1}.btns[hidden]{display:none}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px 0;font-weight:800;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.caps{display:flex;gap:8px}
.cap{flex:1;background:var(--bg);border-radius:12px;padding:8px;text-align:center;font-size:12px;color:var(--sub)}
.cap b{display:block;font-size:22px;color:var(--ink)}
.turn{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;margin-bottom:10px}
.st{width:26px;height:26px;border-radius:50%;flex:none}
.st.b{background:radial-gradient(circle at 35% 30%,#666,#111 60%)}
.st.w{background:radial-gradient(circle at 35% 30%,#fff,#ddd 70%);border:1px solid #bbb}
/* 結果・認定証 */
.result{text-align:center}
.score{font-size:56px;font-weight:800;margin:6px 0}
.score small{font-size:22px;color:var(--sub)}
.stars{font-size:30px;letter-spacing:4px;color:var(--gold)}
.cert{position:relative;max-width:520px;margin:0 auto;background:#fffaf0;border-radius:18px;padding:30px 22px;text-align:center;
  border:3px double var(--gold);box-shadow:0 0 0 8px #fffaf0,0 0 0 10px #ecd9a8}
.cert h2{font-size:28px;letter-spacing:.3em;margin:0 0 18px;color:#8a6500}
.cert .nm{font-size:26px;font-weight:800}
.cert .lv{font-size:58px;font-weight:800;color:var(--accent);line-height:1.1;margin:10px 0}
.cert p{margin:6px 0;line-height:1.7}
.cert .from{margin-top:18px;font-size:14px;color:var(--sub)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.note{font-size:12px;color:var(--sub);line-height:1.6;text-align:center}
.picks{display:grid;gap:10px}
.pick{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;cursor:pointer;text-align:left;width:100%}
.pick .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.pick .nm{font-size:19px;font-weight:800}
.pick .sb{font-size:12px;color:var(--sub);margin-top:2px}
.pick.lock{opacity:.5;cursor:default}
.think{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sub);margin-left:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <rect width="40" height="40" rx="10" fill="#e6bf73"/>
      <path d="M8 14h24M8 26h24M14 8v24M26 8v24" stroke="#5a4020" stroke-width="1.5"/>
      <circle cx="14" cy="14" r="5.5" fill="#222"/><circle cx="26" cy="26" r="5.5" fill="#fff" stroke="#999"/>
    </svg>
    <h1>国分アンビシャス囲碁アプリ<small>テスト版</small></h1>

        <p class="label">なまえ（きょうしつでの よびな）</p>

        <div class="now" id="mName"></div>
        <div class="big" id="mLevel"></div>
        <div class="theme" id="mTheme"></div>
        <div class="ladder" id="ladder"></div>
      </div>
      <div class="menu">
        <button class="btn main big" id="goQuiz">もんだいを とく</button>
        <button class="btn big" id="goCpu">コンピュータと うつ（9ろ）</button>

      <div class="side">

          <div class="qturn" id="qTurn"></div>
        </div>
        <div class="msg" id="qMsg"></div>
        <div class="card"><div class="btns">
          <button class="btn" id="qHint">ヒント</button>
          <button class="btn" id="qRetry">やりなおし</button>

        </div></div>
        <button class="btn" id="qQuit">やめる</button>
      </div>
    </div>
  </section>

  <!-- けっか -->
  <section class="screen" id="sResult">
    <div class="card result" style="max-width:520px;margin:0 auto">
      <div class="label" id="rLv"></div>
      <div class="score" id="rScore"></div>
      <div class="stars" id="rStars"></div>
      <p id="rMsg" style="font-weight:800;font-size:17px"></p>
      <div class="stack">
        <button class="btn main big" id="rAgain"></button>
        <button class="btn big" id="rMenu">メニューへ</button>
      </div>
    </div>
  </section>

  <!-- にんていしょう -->
  <section class="screen" id="sCert">
    <div class="stack">
      <div class="cert">
        <h2>にんていしょう</h2>
        <div class="nm" id="cName"></div>
        <div class="lv" id="cLevel"></div>
        <p>よく がんばりました。<br>ここに みとめます。</p>
        <p class="from" id="cDate"></p>
      </div>
      <button class="btn main big" id="cOk" style="max-width:520px;margin:0 auto">つぎの きゅうへ</button>
    </div>
  </section>

  <!-- コンピュータと うつ -->
  <section class="screen" id="sCpuPick">
    <div class="stack" style="max-width:560px;margin:0 auto">
      <div class="card"><p class="label">あいての つよさを えらんでね（あなたは くろ）</p><div class="picks" id="picks"></div></div>
      <button class="btn big" id="cpBack">メニューへ</button>
    </div>
  </section>
  <section class="screen" id="sCpu">
    <div class="play">
      <div class="boardbox"><div class="boardcard"><svg class="board" id="cBoard"></svg></div></div>
      <div class="side">
        <div class="card">
          <div class="turn"><span class="st b" id="cStone"></span><span id="cTurn"></span></div>
          <div class="caps"><div class="cap">あなたが とった石<b id="cCapB">0</b></div><div class="cap">コンピュータが とった石<b id="cCapW">0</b></div></div>
        </div>
        <div class="msg" id="cMsg"></div>
        <div class="card"><div class="btns" id="cPlayBtns">
          <button class="btn" id="cUndo">まった</button>
          <button class="btn" id="cPass">パス</button>
          <button class="btn main" id="cCount">かぞえる</button>
        </div><div class="btns" id="cEndBtns" hidden>
          <button class="btn main" id="cAgain">もういちど</button>
          <button class="btn" id="cOther">つよさを かえる</button>
        </div></div>
        <button class="btn" id="cQuit">やめる</button>
      </div>
    </div>

  <!-- じゆうに うつ -->

    <div class="play">
      <div class="boardbox"><div class="boardcard"><svg class="board" id="fBoard"></svg></div></div>
      <div class="side">
        <div class="card">
          <div class="turn"><span class="st b" id="fStone"></span><span id="fTurn"></span></div>
          <div class="caps"><div class="cap">くろが とった石<b id="fCapB">0</b></div><div class="cap">しろが とった石<b id="fCapW">0</b></div></div>
        </div>
        <div class="msg" id="fMsg"></div>
        <div class="card"><div class="btns">
          <button class="btn" id="fUndo">まった</button>
          <button class="btn" id="fPass">パス</button>
          <button class="btn main" id="fReset">はじめから</button>
        </div></div>
        <div class="card">
          <p class="label">ごばんの おおきさ</p>
          <div class="seg" id="fSize"><button data-s="9" class="on">9ろ</button><button data-s="13">13ろ</button><button data-s="19">19ろ</button></div>
        </div>
        <button class="btn" id="fBack">メニューへ</button>
      </div>
    </div>
  </section>
</div>

<script>
// 国分アンビシャス囲碁アプリ — ルールエンジン
// 盤面: 0=空, 1=黒, 2=白
const GoEngine = (() => {
  const EMPTY = 0, BLACK = 1, WHITE = 2;
  const other = c => (c === BLACK ? WHITE : BLACK);

  class Board {
    constructor(size = 9) {
      this.size = size;
      this.grid = new Int8Array(size * size);
      this.ko = -1;          // コウで打てない点
      this.turn = BLACK;
      this.captures = { [BLACK]: 0, [WHITE]: 0 }; // 取った石の数
      this.history = [];     // まった用
      this.lastMove = -1;
      this.passes = 0;
    }
    idx(x, y) { return y * this.size + x; }
    xy(i) { return [i % this.size, Math.floor(i / this.size)]; }
    get(i) { return this.grid[i]; }
    neighbors(i) {
      const s = this.size, x = i % s, y = (i / s) | 0, n = [];
      if (x > 0) n.push(i - 1);
      if (x < s - 1) n.push(i + 1);
      if (y > 0) n.push(i - s);
      if (y < s - 1) n.push(i + s);
      return n;
    }
    // つながった石とダメ（呼吸点）
    group(i) {
      const color = this.grid[i];
      const stones = [], libs = new Set(), seen = new Set([i]);
      const stack = [i];
      while (stack.length) {
        const p = stack.pop();
        stones.push(p);
        for (const q of this.neighbors(p)) {
          const c = this.grid[q];
          if (c === EMPTY) libs.add(q);
          else if (c === color && !seen.has(q)) { seen.add(q); stack.push(q); }
        }
      }
      return { color, stones, libs };
    }
    snapshot() {
      return { grid: this.grid.slice(), ko: this.ko, turn: this.turn,
        captures: { ...this.captures }, lastMove: this.lastMove, passes: this.passes };
    }
    restore(s) {
      this.grid = s.grid.slice(); this.ko = s.ko; this.turn = s.turn;
      this.captures = { ...s.captures }; this.lastMove = s.lastMove; this.passes = s.passes;
    }
    // 打てるか確認だけ（盤面は変えない）
    check(i, color = this.turn) {
      if (i < 0 || i >= this.grid.length) return { ok: false, reason: 'outside' };
      if (this.grid[i] !== EMPTY) return { ok: false, reason: 'occupied' };
      if (i === this.ko) return { ok: false, reason: 'ko' };
      const s = this.snapshot();
      const r = this._place(i, color);
      this.restore(s);
      return r;
    }
    _place(i, color) {
      this.grid[i] = color;
      const captured = [];
      for (const q of this.neighbors(i)) {
        if (this.grid[q] === other(color)) {
          const g = this.group(q);
          if (g.libs.size === 0) for (const st of g.stones) {
            if (this.grid[st] !== EMPTY) { this.grid[st] = EMPTY; captured.push(st); }
          }
        }
      }
      const mine = this.group(i);
      if (mine.libs.size === 0) { this.grid[i] = EMPTY; return { ok: false, reason: 'suicide' }; }
      // 単純コウ: 1子取りで、打った石が1子・ダメ1つ
      this.ko = (captured.length === 1 && mine.stones.length === 1 && mine.libs.size === 1)
        ? captured[0] : -1;
      this.captures[color] += captured.length;
      return { ok: true, captured };
    }
    play(i, color = this.turn) {
      const c = this.check(i, color);
      if (!c.ok) return c;
      this.history.push(this.snapshot());
      const r = this._place(i, color);
      this.lastMove = i; this.turn = other(color); this.passes = 0;
      return r;
    }
    pass() {
      this.history.push(this.snapshot());
      this.ko = -1; this.lastMove = -1; this.turn = other(this.turn); this.passes++;
    }
    undo() {
      if (!this.history.length) return false;
      this.restore(this.history.pop());
      return true;
    }
    // アタリ（ダメ1つ）の石の一覧
    atariStones() {
      const res = new Set(), seen = new Set();
      for (let i = 0; i < this.grid.length; i++) {
        if (this.grid[i] === EMPTY || seen.has(i)) continue;
        const g = this.group(i);
        g.stones.forEach(s => seen.add(s));
        if (g.libs.size === 1) g.stones.forEach(s => res.add(s));
      }
      return res;
    }
  }
  return { Board, EMPTY, BLACK, WHITE, other };
})();
if (typeof module !== 'undefined') module.exports = GoEngine;

</script>
<script>
// 国分アンビシャス囲碁アプリ — 盤の表示・共通部品（app と make で共用）
const SVGNS = 'http://www.w3.org/2000/svg';
function starPoints(n) {
  if (n === 9) return [[2, 2], [2, 6], [6, 2], [6, 6], [4, 4]];
  const a = 3, b = n - 4, c = (n - 1) / 2;
  return n === 13 ? [[a, a], [a, b], [b, a], [b, b], [c, c]]
    : [[a, a], [a, b], [b, a], [b, b], [c, c], [a, c], [c, a], [b, c], [c, b]];
}
function fullView(n) { return { x0: 0, y0: 0, x1: n - 1, y1: n - 1 }; }
// 石と答えの まわりだけを 見せる（9路は ぜんぶ）
function autoView(board, extra = []) {
  const n = board.size; if (n <= 9) return fullView(n);
  let x0 = n, y0 = n, x1 = -1, y1 = -1;
  const add = i => { const [x, y] = board.xy(i); x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
  for (let i = 0; i < n * n; i++) if (board.get(i)) add(i);
  extra.forEach(add);
  if (x1 < 0) return fullView(n);
  x0 -= 2; y0 -= 2; x1 += 2; y1 += 2;
  if (x0 <= 2) x0 = 0; if (y0 <= 2) y0 = 0; if (x1 >= n - 3) x1 = n - 1; if (y1 >= n - 3) y1 = n - 1;
  const grow = (a, b) => { while (b - a < 6) { if (a > 0) a--; if (b - a < 6 && b < n - 1) b++; } return [a, b]; };
  [x0, x1] = grow(x0, x1); [y0, y1] = grow(y0, y1);
  return { x0, y0, x1, y1 };
}
function geomOf(board, view) {
  const v = view || fullView(board.size);
  const cols = v.x1 - v.x0 + 1, rows = v.y1 - v.y0 + 1, m = Math.max(cols, rows);
  const cell = m <= 9 ? 44 : m <= 13 ? 32 : 24, pad = cell * .8;
  return { v, cell, pad, Wd: pad * 2 + cell * (cols - 1), Ht: pad * 2 + cell * (rows - 1) };
}
function drawBoard(svg, board, opt = {}) {
  const n = board.size, { v, cell, pad, Wd, Ht } = geomOf(board, opt.view);
  const px = x => pad + (x - v.x0) * cell, py = y => pad + (y - v.y0) * cell;
  const el = (t, a) => { const e = document.createElementNS(SVGNS, t); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; };
  const id = svg.id;
  svg.setAttribute('viewBox', `0 0 ${Wd} ${Ht}`); svg.innerHTML = '';

:"しろい 石を とろう","hint":"あかい わの 石は、あと 1か所 ふさげば とれるよ","size":9,"B":["ch","di","eh"],"W":["dh","ec","gf"],"toPlay":"B","tree":{"dg":{"ok":true}}},{"id":"L30-05","level":30,"title":"しろい 石を とろう","hint":"あかい わの 石は、あと 1か所 ふさげば とれるよ","size":9,"B":["ab","bd","eg"],"W":["aa","ff","fh"],"toPlay":"B","tree":{"ba":{"ok":true}}},{"id":"L30-06","level":30,"title":"しろい 石を とろう","hint":"あかい わの 石は、あと 1か所 ふさげば とれるよ","size":9,"B":["ab","cc","ha"],"W":["aa","ci","ie"],"toPlay":"B","tree":{"ba":{"ok":true}}},{"id":"L30-07","level":30,"title":"しろい 石を とろう","hint":"あかい わの 石は、あと 1か所 ふさげば とれるよ","size":9,"B":["dh","ei","gc","ie"],"W":["cc","di"],"toPlay":"B","tree":{"ci":{"ok":true}}},{"id":"L30-08","level":30,"title":"しろい 石を とろう","hint":"あかい わの 石は、あと 1か所 ふさげば とれるよ","size":9,"B":["af","ah","eg","ge","gh","hi","ih"],"W":["ac","hh"],"toPlay":"B","tree":{"hg":{"ok":true}}},{"id":"L30-09","level":30,"title":"しろい 石を とろう","hint":"あかい わの 石は、あと 1か所 ふさげば とれるよ","size":9,"B":["bg","eh","fg","fi","ic"],"W":["fh","hc"],"toPlay":"B","tree":{"gh":{"ok":true}}},{"id":"L30-10","level":30,"title":"しろい 石を とろう","hint":"あかい わの 石は、あと 1か所 ふさげば とれるよ","size":9,"B":["af","be","cb","cf"],"W":["bf","hf"],"toPlay":"B","tree":{"bg":{"ok":true}}},{"id":"L30-11","level":30,"title":"しろい 石を とろう","hint":"あかい わの 石は、あと 1か所 ふさげば とれるよ","size":9,"B":["ce","cg","df","hc"],"W":["cf","gc"],"toPlay":"B","tree":{"bf":{"ok":true}}},{"id":"L30-12","level":30,"title":"しろい 石を とろう","hint":"あかい わの 石は、あと 1か所 ふさげば とれるよ","size":9,"B":["fa","ff","ha"],"W":["bf","ca","cg","ga","ge"],"toPlay":"B","tree":{"gb":{"ok":true}}},{"id":"L30-13","level":30,"title":"しろい 石を とろう","hint":"あかい わの 石は、あと 1か所 ふさげば とれるよ","size":9,"B":["dc","dg","ed","fc"],"W":["ab","ec","he"],"toPlay":"B","tree":{"eb":{"ok":true}}},{"id":"L30-14","level":30,"title":"しろい 石を とろう","hint":"あかい わの 石は、あと 1か所 ふさげば とれるよ","size":9,"B":["af","ah","gb","ge"],"W":["ag","eb","he","ie"],"toPlay":"B","tree":{"bg":{"ok":true}}}]};

<script>
(() => {
'use strict';
const { Board, BLACK, WHITE } = GoEngine;
const $ = id => document.getElementById(id);
const CONFIG = { perLevel: 10, pass: 8, reportUrl: 'https://script.google.com/macros/s/AKfycbxzHXP7v_xnQgXV8363bhXsW_pillVl-sQxHPI8YQfiArRCkGWn88bC3q6XPi7-00V1/exec' }; // reportUrl: GASのURL（ステップ後半で設定）

/* ---------- 級 ---------- */
const LEVELS = []; for (let l = 30; l >= 1; l--) LEVELS.push(l); LEVELS.push(0); // 0 = 初段
const lvHTML = l => l > 0 ? `${l}<ruby>級<rt>きゅう</rt></ruby>` : `<ruby>初段<rt>しょだん</rt></ruby>`;
const lvText = l => l > 0 ? `${l}級` : '初段';
function theme(l) {
  if (l >= 26) return '石を とる';
  if (l >= 21) return 'とりあい';
  if (l >= 16) return 'いきる・しぬ';
  if (l >= 11) return '9ろばんで うつ';
  if (l >= 6) return 'てすじ';
  if (l >= 1) return 'ふせき・ヨセ';
  return 'そつぎょう';
}

/* ---------- きろく（端末内） ---------- */
const KEY = 'kokubuIgo.v1';
let store = { kids: [], current: null };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.kids)) store = s; } catch (_) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (_) {} };
const me = () => store.kids.find(k => k.id === store.current);

function report(kid, event) { // 進み具合を記録シートへ送る
  if (!CONFIG.reportUrl || !kid) return;
  const now = Date.now();
  if (event === 'open' && kid.sent && now - kid.sent < 30 * 60 * 1000) return; // ひらいたときは30分に1回
  kid.sent = now; save();
  const quiz = {}; for (const lv in kid.stats) if (lv !== 'cpu') quiz[lv] = kid.stats[lv];
  try {
    fetch(CONFIG.reportUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ kid: kid.id, name: kid.name, level: kid.level, cpu: kid.stats.cpu || {}, quiz, event }) }).catch(() => {});
  } catch (_) {}
}

/* ---------- 画面 ---------- */
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  const k = me();
  $('whoBtn').hidden = !k || id === 'sKids';
  if (k) $('whoBtn').textContent = k.name + ' ▾';
  window.scrollTo(0, 0);
}

/* ---------- 名前えらび ---------- */
let editMode = false;
function renderKids() {
  const list = $('kidList'); list.innerHTML = '';
  store.kids.forEach(k => {
    const d = document.createElement('div'); d.className = 'kid';
    d.innerHTML = `<div class="nm"></div><div class="lv">${lvHTML(k.level)}</div>`;
    d.querySelector('.nm').textContent = k.name;
    d.onclick = () => { store.current = k.id; save(); openMenu(); };
    if (editMode) {
      const x = document.createElement('button'); x.className = 'del'; x.textContent = 'けす';
      x.onclick = e => { e.stopPropagation();
        if (x.dataset.sure) { store.kids = store.kids.filter(z => z !== k); if (store.current === k.id) store.current = null; save(); renderKids(); }
        else { x.dataset.sure = 1; x.textContent = 'ほんとうに けす'; } };
      d.appendChild(x);
    }
    list.appendChild(d);
  });
  const add = document.createElement('div'); add.className = 'kid add'; add.textContent = '＋ なまえを ついか';
  add.onclick = () => { $('addBox').hidden = false; $('nameIn').focus(); };
  list.appendChild(add);
  if (store.kids.length) {
    const ed = document.createElement('div'); ed.className = 'kid add'; ed.textContent = editMode ? 'おわる' : 'なまえを けす';
    ed.onclick = () => { editMode = !editMode; renderKids(); };
    list.appendChild(ed);
  }
  $('addBox').hidden = store.kids.length > 0;
}
$('addOk').onclick = () => {
  const name = $('nameIn').value.trim(); if (!name) return;
  const k = { id: 'k' + Date.now(), name, level: 30, stats: {} };
  store.kids.push(k); store.current = k.id; save(); $('nameIn').value = ''; openMenu();
};
$('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('addOk').click(); });
$('whoBtn').onclick = () => { editMode = false; renderKids(); show('sKids'); };

/* ---------- メニュー ---------- */
function openMenu() {
  const k = me(); if (!k) { renderKids(); return show('sKids'); }
  $('mName').textContent = k.name + ' さんは いま';
  $('mLevel').innerHTML = lvHTML(k.level);
  $('mTheme').textContent = 'テーマ：' + theme(k.level);
  const lad = $('ladder'); lad.innerHTML = '';
  LEVELS.forEach(l => { const i = document.createElement('i'); if (l > k.level) i.className = 'done'; if (l === k.level) i.className = 'cur'; lad.appendChild(i); });
  const n = (PROBLEMS[k.level] || []).length;
  $('goQuiz').disabled = n < CONFIG.perLevel;
  $('goQuiz').textContent = n < CONFIG.perLevel ? 'この きゅうの もんだいは じゅんびちゅう' : 'もんだいを とく';
  $('mInfo').textContent = `${CONFIG.perLevel}もん中 ${CONFIG.pass}もん せいかいで つぎの きゅうへ`;
  show('sMenu'); report(k, 'open');
}
$('goQuiz').onclick = startQuiz;

/* ---------- もんだい ---------- */
let Q = null; // いまの セッション
function startQuiz() {
  const k = me(), bank = PROBLEMS[k.level] || [];
  const list = bank.slice().sort(() => Math.random() - .5).slice(0, CONFIG.perLevel);
  Q = { level: k.level, list, i: 0, results: [] };
  show('sQuiz'); loadProblem();
}
function loadProblem() {
  const p = Q.list[Q.i], sym = p.noRotate ? 0 : Math.floor(Math.random() * 8);
  const { board: b, tree, view } = boardFromProblem(p, sym);
  Q.board = b; Q.start = b.snapshot(); Q.tree = tree; Q.node = Q.tree; Q.view = view;
  Q.state = 'play'; Q.missed = false; Q.mark = null; Q.circle = null; Q.hint = false; Q.p = p;
  $('qLv').innerHTML = lvHTML(Q.level);
  $('qNo').textContent = `${Q.i + 1} / ${Q.list.length}`;
  $('qTitle').textContent = p.title;
  $('qTurn').textContent = (b.turn === BLACK ? 'くろ' : 'しろ') + 'の ばんです';
  dots(); msg('どこに うつかな？'); buttons(); drawQ();
}
function drawQ() { drawBoard($('qBoard'), Q.board, { atari: Q.hint, mark: Q.mark, circle: Q.circle, view: Q.view }); }
function dots() {
  const d = $('qDots'); d.innerHTML = '';
  Q.list.forEach((_, k) => { const i = document.createElement('i'); const r = Q.results[k]; if (r === true) i.className = 'ok'; else if (r === false) i.className = 'ng'; if (k === Q.i) i.classList.add('cur'); d.appendChild(i); });
}
function msg(t, kind) { const m = $('qMsg'); m.textContent = t; m.className = 'msg' + (kind ? ' ' + kind : ''); }
function buttons() {
  $('qHint').hidden = Q.state !== 'play';
  $('qRetry').hidden = Q.state !== 'wrong';
  $('qNext').hidden = Q.state === 'play' || Q.state === 'wait';
  $('qNext').textContent = Q.i === Q.list.length - 1 ? 'けっかを みる' : 'つぎへ';
}
$('qBoard').addEventListener('click', e => {
  if (!Q || Q.state !== 'play') return;
  const b = Q.board, i = pointAt($('qBoard'), b, e, Q.view); if (i < 0 || b.get(i)) return;
  const key = toSgf(b, i), node = Q.node[key];
  const r = b.play(i);
  if (!r.ok) { sound('ng'); msg(r.reason === 'ko' ? 'コウだよ。そこは まだ うてないよ' : 'そこは うてないよ', 'warn'); return; }
  if (!node) { // まちがい
    sound('ng'); Q.mark = i; Q.state = 'wrong';
    if (!Q.missed) { Q.missed = true; Q.results[Q.i] = false; }
    msg('ざんねん！ もういちど かんがえてみよう', 'warn'); dots(); buttons(); drawQ(); return;
  }
  sound(r.captured.length ? 'ok' : 'stone');
  if (node.ok) {
    Q.state = 'done'; Q.circle = i;
    if (!Q.missed) Q.results[Q.i] = true;
    msg(Q.missed ? 'できたね！（つぎは 1かいで できるかな）' : 'せいかい！', 'good'); dots(); buttons(); drawQ(); return;
  }
  // あいての こたえ
  Q.state = 'wait'; buttons(); drawQ();
  setTimeout(() => { b.play(toIdx(b, node.reply)); sound('stone'); Q.node = node.next || {}; Q.state = 'play'; msg('つぎは どこに うつ？'); buttons(); drawQ(); }, 500);
});
$('qRetry').onclick = () => { Q.board.restore(Q.start); Q.board.history = []; Q.node = Q.tree; Q.mark = null; Q.state = 'play'; msg('どこに うつかな？'); buttons(); drawQ(); };
$('qHint').onclick = () => { Q.hint = true; msg(Q.p.hint || 'よく みてみよう', 'hint'); drawQ(); };
$('qNext').onclick = () => {
  if (Q.results[Q.i] === undefined) Q.results[Q.i] = false;
  if (Q.i < Q.list.length - 1) { Q.i++; loadProblem(); } else finishQuiz();
};
$('qQuit').onclick = openMenu;

function finishQuiz() {
  const k = me(), ok = Q.results.filter(x => x).length, pass = ok >= CONFIG.pass;
  const st = k.stats[Q.level] || { tries: 0, best: 0 };
  st.tries++; st.best = Math.max(st.best, ok); k.stats[Q.level] = st;
  $('rLv').innerHTML = lvHTML(Q.level) + ' の けっか';
  $('rScore').innerHTML = `${ok}<small> / ${Q.list.length}</small>`;
  $('rStars').textContent = ok >= 10 ? '★★★' : ok >= 8 ? '★★☆' : ok >= 5 ? '★☆☆' : '☆☆☆';
  if (pass) {
    const idx = LEVELS.indexOf(Q.level);
    const next = LEVELS[Math.min(idx + 1, LEVELS.length - 1)];
    const graduated = Q.level === 0;
    if (!graduated) k.level = next;
    save(); report(k, 'promote');
    $('rMsg').textContent = graduated ? 'しょだん ごうかく！' : 'ごうかく！ しょうきゅう です！';
    $('rAgain').textContent = 'にんていしょうを みる';
    $('rAgain').onclick = () => cert(k, graduated ? 0 : next);
    sound('fan'); confetti();
  } else {
    save();
    $('rMsg').textContent = `あと ${CONFIG.pass - ok}もんで ごうかく！`;
    $('rAgain').textContent = 'もういちど ちょうせん';
    $('rAgain').onclick = startQuiz;
  }
  show('sResult');
}
$('rMenu').onclick = openMenu;

function cert(k, level) {
  $('cName').textContent = k.name + ' さん';
  $('cLevel').innerHTML = lvHTML(level);
  const d = new Date();
  $('cDate').textContent = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日　国分アンビシャス広場`;
  show('sCert'); confetti();
}
$('cOk').onclick = openMenu;
function confetti() {
  const box = document.createElement('div'); box.className = 'confetti';
  const colors = ['#2f8f5b', '#e0a526', '#e5483f', '#4a90d9', '#f2c94c'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('i');
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = colors[i % 5];
    c.style.animationDuration = 1.6 + Math.random() * 1.6 + 's'; c.style.animationDelay = Math.random() * .6 + 's';
    box.appendChild(c);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 4000);
}

/* ---------- コンピュータと うつ ---------- */
const CPU_LV = [
  { key: 'weak', name: 'よわい', sub: 'はじめての ひとに', icon: '🐣', bg: '#fdf0c8', need: 30 },
  { key: 'normal', name: 'ふつう', sub: '20級から', icon: '🐶', bg: '#e3f4ea', need: 20 },
  { key: 'strong', name: 'つよい', sub: '11級から', icon: '🦁', bg: '#fde3dc', need: 11 },
];
let worker = null, wSeq = 0; const wWait = {};
function cpuCall(msg) {
  return new Promise(res => {
    if (worker === null) {
      try { worker = new Worker(URL.createObjectURL(new Blob([$('cpuSrc').textContent], { type: 'text/javascript' }))); worker.onmessage = e => { const f = wWait[e.data.id]; delete wWait[e.data.id]; f && f(e.data); }; }
      catch (_) { worker = false; }
    }
    if (worker) { const id = ++wSeq; wWait[id] = res; worker.postMessage({ ...msg, id }); }
    else setTimeout(() => res(msg.type === 'think' ? GoCPU.think(msg.n, msg.grid, msg.ko, msg.color, msg.level, msg.oppPassed, msg.komi) : GoCPU.estimate(msg.n, msg.grid, msg.ko, msg.color, msg.komi)), 30);
  });
}
function renderPicks() {
  const k = me(), box = $('picks'); box.innerHTML = '';
  const rec = (k.stats.cpu || {});
  CPU_LV.forEach(L => {
    const open = k.level <= L.need, r = rec[L.key] || { w: 0, l: 0 };
    const b = document.createElement('button'); b.className = 'pick' + (open ? '' : ' lock');
    b.innerHTML = `<span class="ic" style="background:${L.bg}">${open ? L.icon : '🔒'}</span><span><div class="nm">${L.name}</div><div class="sb">${open ? `かち ${r.w}・まけ ${r.l}` : L.sub + ' あそべるよ'}</div></span>`;
    if (open) b.onclick = () => startCpu(L.key);
    box.appendChild(b);
  });
  show('sCpuPick');
}
$('goCpu').onclick = renderPicks;
$('cpBack').onclick = openMenu;
let C = null;
function startCpu(level) {
  C = { level, board: new Board(9), state: 'kid', terr: null, dead: null };
  $('cPlayBtns').hidden = false; $('cEndBtns').hidden = true;
  cMsg('すきな ところに うってね'); cDraw(); show('sCpu');
}
function cMsg(t, kind, thinking) { const m = $('cMsg'); m.innerHTML = ''; m.append(t); if (thinking) { const d = document.createElement('span'); d.className = 'think'; m.append(d); } m.className = 'msg' + (kind ? ' ' + kind : ''); }
function cDraw() {
  const b = C.board;
  drawBoard($('cBoard'), b, { atari: C.state !== 'count' && me().level >= 21, terr: C.terr, dead: C.dead });
  $('cStone').className = 'st ' + (b.turn === BLACK ? 'b' : 'w');
  $('cTurn').textContent = C.state === 'count' ? 'おしまい' : b.turn === BLACK ? 'あなたの ばん' : 'コンピュータの ばん';
  $('cCapB').textContent = b.captures[BLACK]; $('cCapW').textContent = b.captures[WHITE];
}
$('cBoard').addEventListener('click', e => {
  if (!C || C.state !== 'kid') return;
  const b = C.board, i = pointAt($('cBoard'), b, e); if (i < 0) return;
  const r = b.play(i);
  if (!r.ok) { if (r.reason === 'suicide') { cMsg('そこは うてないよ', 'warn'); sound('ng'); } else if (r.reason === 'ko') { cMsg('コウだよ。ほかに 1かい うってからね', 'warn'); sound('ng'); } return; }
  sound(r.captured.length ? 'ok' : 'stone');
  if (r.captured.length) cMsg(`${r.captured.length}こ とったよ！`, 'good');
  cDraw(); cpuTurn(false);
});
async function cpuTurn(oppPassed) {
  C.state = 'cpu'; cDraw();
  const t0 = Date.now(), my = C;
  if (!oppPassed && !$('cMsg').classList.contains('good')) cMsg('コンピュータが かんがえちゅう', '', true);
  const b = C.board;
  const res = await cpuCall({ type: 'think', n: 9, grid: Array.from(b.grid), ko: b.ko, color: WHITE, level: C.level, oppPassed, komi: 0 });
  await new Promise(r => setTimeout(r, Math.max(0, 450 - (Date.now() - t0))));
  if (C !== my) return;
  if (res.pass) {
    b.pass();
    if (b.passes >= 2) return countGame();
    cMsg('コンピュータは パスしたよ。おわりなら パスか かぞえる');
  } else {
    const r = b.play(res.move);
    if (!r.ok) { b.pass(); cMsg('コンピュータは パスしたよ'); }
    else { sound('stone'); if (r.captured.length) cMsg(`${r.captured.length}こ とられた！`, 'warn'); else cMsg('あなたの ばんだよ'); }
  }
  C.state = 'kid'; cDraw();
}
$('cPass').onclick = () => { if (C.state !== 'kid') return; C.board.pass(); if (C.board.passes >= 2) countGame(); else { cMsg('パスしたよ'); cpuTurn(true); } };
$('cUndo').onclick = () => { if (C.state !== 'kid') return; const b = C.board; if (b.history.length >= 2) { b.undo(); b.undo(); cMsg('2て もどしたよ'); cDraw(); } };
$('cCount').onclick = () => { if (C.state === 'kid') countGame(); };
async function countGame() {
  C.state = 'count'; cMsg('かぞえています', '', true); cDraw();
  const b = C.board, my = C;
  const e = await cpuCall({ type: 'estimate', n: 9, grid: Array.from(b.grid), ko: b.ko, color: b.turn, komi: 0 });
  if (C !== my) return;
  C.terr = e.terr; C.dead = e.dead;
  const win = e.black > e.white, draw = e.black === e.white;
  const k = me(), cs = k.stats.cpu = k.stats.cpu || {}, r = cs[C.level] = cs[C.level] || { w: 0, l: 0 };
  if (win) r.w++; else if (!draw) r.l++; save(); report(k, 'game');
  cMsg(`くろ ${e.black}・しろ ${e.white}　${win ? 'あなたの かち！' : draw ? 'ひきわけ' : 'コンピュータの かち'}`, win ? 'good' : draw ? '' : 'warn');
  if (win) { sound('fan'); confetti(); }
  $('cPlayBtns').hidden = true; $('cEndBtns').hidden = false; cDraw();
}
$('cAgain').onclick = () => startCpu(C.level);
$('cOther').onclick = renderPicks;
$('cQuit').onclick = () => { C = null; openMenu(); };

/* ---------- じゆうに うつ ---------- */
let F, fHover = -1;
function fNew(n) { F = new Board(n); fMsg('すきな ところに 石を おいてね'); fDraw(); }
function fMsg(t, kind) { const m = $('fMsg'); m.textContent = t; m.className = 'msg' + (kind ? ' ' + kind : ''); }
function fDraw() {
  drawBoard($('fBoard'), F, { atari: true, hover: fHover });
  $('fStone').className = 'st ' + (F.turn === BLACK ? 'b' : 'w');
  $('fTurn').textContent = F.turn === BLACK ? 'くろの ばん' : 'しろの ばん';
  $('fCapB').textContent = F.captures[BLACK]; $('fCapW').textContent = F.captures[WHITE];
}
$('fBoard').addEventListener('click', e => {
  const i = pointAt($('fBoard'), F, e); if (i < 0) return;
  const r = F.play(i);
  if (!r.ok) { if (r.reason === 'suicide') { fMsg('そこは うてないよ（石が すぐ とられる ばしょ）', 'warn'); sound('ng'); } else if (r.reason === 'ko') { fMsg('コウだよ。ほかに 1かい うってからね', 'warn'); sound('ng'); } return; }
  if (r.captured.length) { fMsg(`${r.captured.length}こ とったよ！`, 'good'); sound('ok'); } else { fMsg('すきな ところに 石を おいてね'); sound('stone'); }
  fHover = -1; fDraw();
});
$('fBoard').addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; const i = pointAt($('fBoard'), F, e); if (i !== fHover) { fHover = i; fDraw(); } });
$('fBoard').addEventListener('pointerleave', () => { fHover = -1; fDraw(); });
$('fUndo').onclick = () => { if (F.undo()) { fMsg('ひとつ もどしたよ'); fDraw(); } };
$('fPass').onclick = () => { F.pass(); fMsg(F.passes >= 2 ? 'ふたりとも パスしたので おしまい' : 'パスしたよ'); fDraw(); };
$('fReset').onclick = () => fNew(F.size);
$('fSize').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; [...$('fSize').children].forEach(x => x.classList.toggle('on', x === b)); fNew(+b.dataset.s); });
$('goFree').onclick = () => { fNew(9); [...$('fSize').children].forEach(x => x.classList.toggle('on', x.dataset.s === '9')); show('sFree'); };
$('fBack').onclick = openMenu;

if (location.hash === '#test') window.__app = { get Q() { return Q; }, get P() { return PROBLEMS; } };
/* ---------- 追加の問題（problems-extra.json） ---------- */
function mergeExtra(extra) {
  for (const lv in extra) { const ids = new Set((PROBLEMS[lv] || []).map(p => p.id)); PROBLEMS[lv] = (PROBLEMS[lv] || []).concat((extra[lv] || []).filter(p => !ids.has(p.id))); }
}
async function loadExtra() {
  try { const r = await fetch('problems-extra.json', { cache: 'no-store' }); if (r.ok) { mergeExtra(await r.json()); if ($('sMenu').classList.contains('on')) openMenu(); } } catch (_) {}
}
/* ---------- はじめ ---------- */
if (me()) openMenu(); else { renderKids(); show('sKids'); }
loadExtra();
})();
</script>
